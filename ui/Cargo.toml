[package]
name = "nrztube-ui"
version = "1.0.1"
edition = "2024"
description = "Oberfläche von nrzTube – Dioxus 0.7 (WebAssembly) mit Komponenten von nrzUI"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
nrztube-types = { path = "../types" }
dioxus = { version = "0.7", default-features = false, features = ["web", "router", "macro", "html", "signals", "hooks", "launch", "logger"] }
icons = { version = "0.19", features = ["dioxus"] }
tw_merge = "0.1"
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlInputElement", "HtmlMediaElement",
  "HtmlVideoElement", "KeyboardEvent", "Location", "MouseEvent", "Navigator", "Clipboard", "Storage",
  "TextTrack", "TextTrackList", "TextTrackMode", "TimeRanges", "Window", "File", "FileList", "Blob",
  "DomRect", "History", "Url", "MediaError",
] }
urlencoding = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = false
panic = "abort"
